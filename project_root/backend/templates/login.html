<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login or Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        body {
            background-color: #f0f2f5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
            max-width: 400px;
            width: 100%;
            transition: all 0.3s ease;
        }

        .container:hover {
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.2);
        }

        h1 {
            margin-bottom: 20px;
            font-size: 28px;
            font-weight: bold;
            color: #343a40;
        }

        h2 {
            margin-top: 20px;
            margin-bottom: 10px;
            font-size: 22px;
            font-weight: bold;
            color: #495057;
        }

        .alert-container {
            margin-bottom: 20px;
        }

        input[type="text"], input[type="password"] {
            margin-bottom: 15px;
        }

        .form-control {
            padding: 12px;
            font-size: 16px;
            border-radius: 50px;
            border: 1px solid #ced4da;
            transition: border-color 0.3s ease;
        }

        .form-control:focus {
            border-color: #007bff;
            box-shadow: 0 0 0 0.2rem rgba(0, 123, 255, 0.25);
        }

        .btn {
            font-size: 16px;
            padding: 10px 25px;
            border-radius: 50px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .btn-outline-primary {
            border: 2px solid #007bff;
        }

        .btn-outline-primary:hover {
            background-color: #007bff;
            color: #ffffff;
        }

        .btn-outline-primary:active {
            background-color: #0056b3;
            border-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-center">Login or Register</h1>

        <!-- Display flash messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="alert-container">
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <form action="/login" method="post">
            <h2 class="text-center">Login</h2>
            <input type="text" name="username" placeholder="Enter your username" class="form-control w-75 my-2 d-block mx-auto" required>
            <input type="password" name="password" placeholder="Enter your password" class="form-control w-75 d-block mx-auto" required>
            <button type="submit" class="btn btn-outline-primary d-block mx-auto my-2">Login</button>  
        </form>

        <form action="/register" method="post">
            <h2 class="text-center">Register</h2>
            <input type="text" name="username" placeholder="Choose a username" class="form-control w-75 my-2 d-block mx-auto" required>
            <input type="password" name="password" placeholder="Choose a password" class="form-control w-75 d-block mx-auto" required>
            <button type="submit" class="btn btn-outline-primary d-block mx-auto my-2">Register</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
